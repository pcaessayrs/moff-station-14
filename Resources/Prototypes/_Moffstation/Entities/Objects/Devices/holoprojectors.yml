- type: entity
  parent: Holoprojector
  id: HoloshieldProjector
  name: hologunport projector
  suffix: pirate
  description: Sends up a mighty gunport to cover ye blaggards (from bullets, not from the eyes of the Almighty).
  components:
  # FIXME: this always spawns it in a south-facing direction
  - type: HolosignProjector
    signProto: HolosignGunport
    chargeUse: 120
    # Rotateable: true
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/atmos.rsi
    state: icon
  - type: Tag
    tags:
    - HolofanProjector

- type: entity
  id: HolosignGunport
  name: holographic gunport
  description: A jolly barrier that only allows bullets through in a single direction, but bodies are unobstructed.
  components:
  - type: Physics
    bodyType: Dynamic
    canCollide: true
  - type: Sprite
    sprite: Structures/Holo/field.rsi # placeholder
    state: icon
    scale: 2, 1 
  - type: Projectile
  - type: Turnstile                 # A turnstile for bullets!!
    processSoftCollisions: true
    processWhitelist:
      components:
        - Projectile
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-0.5,1,0.5" # long boy
        density: 100
        mask:
        - FullTileMask
        layer:
        - BulletImpassable
  - type: TimedDespawn
    lifetime: 60
  - type: PointLight
    enabled: true
    radius: 3
    color: pink
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

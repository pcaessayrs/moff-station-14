- type: entity
  parent: Holoprojector
  id: HoloshieldProjector
  name: hologunport projector
  suffix: pirate
  description: Sends up a mighty gunport to cover ye blaggards (from bullets, not from the eyes of the Almighty).
  components:
  - type: HolosignProjector
    signProto: HolosignGunport
    chargeUse: 120
    # Rotateable: true
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/atmos.rsi
    state: icon
  - type: Tag
    tags:
    - HolofanProjector

- type: entity
  id: HolosignGunport
  parent: HolosignWetFloor
  name: holographic gunport
  description: A jolly barrier that only allows bullets through in a single direction, but bodies are unobstructed.
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Sprite
    sprite: Structures/Holo/field.rsi # placeholder
    state: icon
    scale: 2, 0.5 
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-0.25,1,0.25" # same dimensions as a door for tall turnstile, prevents objects being thrown through
        density: 100
        mask:
        - FullTileMask
        layer:
        - BulletImpassable
#      fix2:
#        shape:
#          !type:PhysShapeAabb
#          bounds: "-0.50,-0.50,0.50,0.50" # same dimensions as a door for tall turnstile, prevents objects being thrown through
#        hard: false
#        mask:
#        - FullTileMask
#        layer:
#        - BulletImpassable
  - type: TimedDespawn
    lifetime: 120
  - type: PointLight
    enabled: true
    radius: 3
    color: pink
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
#  - type: Turnstile
#    processWhitelist:
#      components:
#      - MobState # no mobs
#      - Pullable # no dragging things in
  - type: Turnstile
    processWhitelist:
      components:
        - Reflective 
